AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Snappy Study – Static website hosting
  S3 bucket (private) + CloudFront distribution + ACM TLS certificate + Route 53 records.
  Domain: snappystudy.com

# ══════════════════════════════════════════════════════════════
# PARAMETERS
# ══════════════════════════════════════════════════════════════
Parameters:

  DomainName:
    Type: String
    Default: snappystudy.com
    Description: Root domain name (no www prefix)

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >
      Route 53 Hosted Zone ID for the domain.
      Find it in Route 53 → Hosted zones → snappystudy.com → Hosted zone ID.

  CertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate in us-east-1 that covers snappystudy.com AND www.snappystudy.com.
      CloudFront requires certificates to be in us-east-1.
      If you don't have one yet, run the companion script in aws/create-cert.sh first.

  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod, staging]
    Description: Deployment environment tag

# ══════════════════════════════════════════════════════════════
# RESOURCES
# ══════════════════════════════════════════════════════════════
Resources:

  # ── S3 bucket for CloudFront access logs ────────────────────
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'snappystudy-logs-${Environment}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Project
          Value: SnappyStudy

  # ── S3 bucket (private — accessed only via CloudFront OAC) ──
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'snappystudy-website-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: SnappyStudy
        - Key: Environment
          Value: !Ref Environment

  # ── Origin Access Control (modern replacement for OAI) ──────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'snappystudy-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: OAC for Snappy Study website bucket

  # ── Bucket policy: allow CloudFront OAC to read the bucket ──
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ── CloudFront distribution ──────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Snappy Study website (${Environment})'
        DefaultRootObject: index.html

        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'

        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        HttpVersion: http2and3
        IPV6Enabled: true

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''   # empty — we use OAC instead
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (managed)
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods:  [GET, HEAD]

        # Serve index.html for any path not found (SPA-style fallback)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

        PriceClass: PriceClass_100  # US, Canada, Europe — cheapest

        Logging:
          Bucket: !GetAtt LogsBucket.RegionalDomainName
          IncludeCookies: false
          Prefix: cloudfront/

      Tags:
        - Key: Project
          Value: SnappyStudy
        - Key: Environment
          Value: !Ref Environment

  # ── Route 53: apex record ────────────────────────────────────
  DnsRecordApex:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (fixed value, same for all CF distributions)

  DnsRecordApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  # ── Route 53: www redirect record ───────────────────────────
  DnsRecordWww:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecordWwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

# ══════════════════════════════════════════════════════════════
# OUTPUTS
# ══════════════════════════════════════════════════════════════
Outputs:

  BucketName:
    Description: S3 bucket to upload website files to
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (needed to create cache invalidations)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  CloudFrontDomain:
    Description: CloudFront domain name (use to verify before DNS cutover)
    Value: !GetAtt CloudFrontDistribution.DomainName

  WebsiteUrl:
    Description: Live website URL
    Value: !Sub 'https://${DomainName}'
